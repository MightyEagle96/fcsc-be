<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="pt-5 text-center mb-5">
        <img src="./fcsclogo.png" height="100" />

        <p class="pt-4" style="font-size: 30px; font-weight: 700">
          FCSC PROMOTION EXAMINATION 2025
        </p>
      </div>
      <div class="d-flex justify-content-between mb-5">
        <div>
          <img
            src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cGVyc29ufGVufDB8fDB8fHww&auto=format&fit=crop&q=60&w=500"
            style="width: 200px; height: 150px"
          />
        </div>
        <div>
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg"
            style="width: 200px; height: 200px"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-lg-6">
          <div class="mb-3">
            <small>Name</small>
            <p>{{name}}</p>
          </div>
          <div class="mb-3">
            <small>Grade Level</small>
            <p>{{gradeLevel}}</p>
          </div>
          <div class="mb-3">
            <small>Cadre</small>
            <p>{{cadre}}</p>
          </div>
          <div class="mb-3">
            <small>Phone Number</small>
            <p>{{phoneNumber}}</p>
          </div>
          <div class="mb-3">
            <small>Email Address</small>
            <p>{{emailAddress}}</p>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <small>Exam Centre</small>
            <p>{{examCentre}}</p>
          </div>
          <div class="mb-3">
            <small>Exam Number</small>
            <p>{{examNumber}}</p>
          </div>
          <div class="mb-3">
            <small>Seat Number</small>
            <p>{{seatNumber}}</p>
          </div>
          <div class="mb-3">
            <small>Exam Date</small>
            <p>{{examDate}}</p>
          </div>
          <div class="mb-3">
            <small>Exam Time</small>
            <p>{{examTime}}</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
